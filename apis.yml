name: Arondite
description: 'Arondite is a defence technology company building Cobalt, a defence software
  platform for accelerated decision making that orchestrates missions and manages
  operational intelligence. Cobalt brings together sighting reports, real-time notifications
  and alerts, mapping and visualisation, task management and kanban workflows, and
  observation and monitoring tools to support complex military and defence operations
  across use cases including Hybrid Navy, C-UAS, Recce-Strike, and Site Security.
  Arondite combines operational and technical expertise to deliver technology with
  immediate, real-world impact on a global scale. It was surfaced as a portfolio company
  of Index Ventures. Arondite does not currently publish a public API, developer portal,
  SDK, or documentation surface, so this profile captures its identity and probed
  domain-security posture rather than API artifacts.'
